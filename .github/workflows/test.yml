name: Desktop eSigner CKA smoke test (diagnostic only)

# Isolated, NON-PUBLISHING harness to debug the SSL.com eSigner CKA blocker
# without running the full release pipeline (which builds + signs + publishes
# to Spaces). This workflow ONLY exercises the Cloud Key Adapter setup:
#   download <ver> -> install -> dump usage -> config -> unload/load ->
#   list code-signing certs -> test-sign a throwaway EXE via signtool.
# It never touches Spaces, never builds MSIX/MSI, never cuts a release.
#
# Background: eSignerCKATool v1.0.8 (build 20250228 — a pre-release) crashes in
# `config` with a NullReferenceException / 0xC0000005 ~9s in (AFTER the network
# auth round-trip), with sane secret lengths. v1.0.7 is the latest STABLE
# release; this harness defaults to it. The TOTP flag spelling differs between
# builds (the official SSL.com sample uses "-totp"; the 1.0.8 binary's own help
# prints "-topt"), so we auto-detect it from the tool's usage output.
#
# Run via: Actions -> this workflow -> "Run workflow" (or the API). Iterate on
# cka_version / totp_flag inputs — no code edits or tag burns between attempts.

on:
  workflow_dispatch:
    inputs:
      cka_version:
        description: "eSignerCKA release to test (e.g. 1.0.7, 1.0.6, 1.0.4, 1.0.8)"
        required: true
        default: "1.0.7"
        type: string
      totp_flag:
        # Which value goes under which flag. The two value flags are -topt and
        # -pass, but their MEANING differs by build (1.0.7 help: -topt=Password,
        # -pass=TOTP; 1.0.8 help: the reverse). "auto" reads the tool's own usage
        # descriptions; "standard" = -topt:<TOTP> -pass:<pass> (what prior runs
        # used, NPE'd); "swapped" = -topt:<pass> -pass:<TOTP> (1.0.7's own help).
        description: "Arg mapping: auto | standard | swapped"
        required: true
        default: "auto"
        type: string
      mode:
        description: "eSigner API mode: product | sandbox"
        required: true
        default: "product"
        type: string

permissions:
  contents: read

jobs:
  cka-smoke:
    runs-on: windows-latest
    env:
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
      CKA_VERSION: ${{ inputs.cka_version }}
      TOTP_FLAG: ${{ inputs.totp_flag }}
      CKA_MODE: ${{ inputs.mode }}
    steps:
      - name: eSigner CKA setup + test-sign
        shell: pwsh
        run: |         
          $MasterKeyFile = "C:\eSignerCKA\master.key"
          $INSTALL_DIR="C:\eSignerCKA"
          
          # Download and Extract eSignerCKA
          Invoke-WebRequest -OutFile eSigner_CKA_Setup.zip "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.8/SSL.COM-eSigner-CKA_1.0.8.zip"
          Expand-Archive -Force eSigner_CKA_Setup.zip
          Move-Item -Destination "eSigner_CKA_Installer.exe" -Path "eSigner_CKA_*\*.exe"
          New-Item -ItemType Directory -Force -Path ${INSTALL_DIR}
          
          # Install eSignerCKA
          ./eSigner_CKA_Installer.exe /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR="${INSTALL_DIR}" | Out-Null
          Remove-Item ./eSigner_CKA_Installer.exe
          
          # Load Certificate
          $mode="sandbox"
          & ${INSTALL_DIR}\eSignerCKATool.exe config -mode $mode -user "$env:ES_USERNAME" -pass "$env:ES_PASSWORD" -totp "$env:ES_TOTP_SECRET" -key "$MasterKeyFile" -r
          & ${INSTALL_DIR}\eSignerCKATool.exe unload
          & ${INSTALL_DIR}\eSignerCKATool.exe load

      # Collect the eSignerCKA logs SSL.com support (Tier 2) asked for. Runs even
      # when the CKA step fails (if: always()) and never fails the job itself.
      - name: Collect eSignerCKA logs (for SSL.com support)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = "$env:RUNNER_TEMP\esignercka-logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($src in @("$env:APPDATA\eSignerCKA", "$env:APPDATA\eSignerCKA\KSP", "$env:LOCALAPPDATA\eSignerCKA")) {
              Write-Host "==================== $src ===================="
              if (Test-Path $src) {
                  Get-ChildItem -Recurse -Force $src -ErrorAction SilentlyContinue |
                      ForEach-Object { Write-Host "  $($_.FullName)  ($($_.Length) bytes)" }
                  Copy-Item -Recurse -Force $src (Join-Path $dest ($src -replace '[:\\]','_')) -ErrorAction SilentlyContinue
                  Get-ChildItem -Recurse -File $src -ErrorAction SilentlyContinue |
                      Where-Object { $_.Length -lt 65536 } | ForEach-Object {
                          Write-Host "----- BEGIN $($_.FullName) -----"
                          Get-Content -Raw -ErrorAction SilentlyContinue $_.FullName | Write-Host
                          Write-Host "----- END $($_.FullName) -----"
                      }
              } else { Write-Host "  (folder not present)" }
          }
      - name: Upload eSignerCKA logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esignercka-logs
          path: ${{ runner.temp }}/esignercka-logs
          if-no-files-found: warn

  # Decisive disambiguation: run the SAME Desktop secrets through CodeSignTool
  # (the exact path proven working in the Messenger release). This tells us
  # whether ES_USERNAME/ES_PASSWORD/ES_TOTP_SECRET are valid independent of the
  # CKA tool: if THIS job passes but cka-smoke fails on invalid_grant, the creds
  # are fine and the problem is CKA-specific (escalate). If THIS job also fails
  # auth, the Desktop secrets themselves are wrong (vs the Messenger repo).
  codesign-auth:
    name: CodeSignTool auth check (same secrets, proven path)
    runs-on: windows-latest
    steps:
      - name: Prepare a throwaway PE to sign
        shell: pwsh
        run: Copy-Item "$env:WINDIR\System32\timeout.exe" "${{ github.workspace }}\cs_target.exe" -Force
      - name: Sign via SSL.com CodeSignTool (authenticates with the Desktop secrets)
        uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/cs_target.exe
          override: true
          malware_block: false
